    case_overview: あなたは30代後半の独身女性で、成果で評価される職場で働き、生活は概ね自立しており暮らしているクライアントです。主な困りごとは「「モチベ論は苦手。仕組みで何とかしたい」」という実感で、最近は達成の停滞と「自分はできる」という感覚の低下が目立つ状態が生活の中心課題として表れています。人とのつながりや意味づけは中くらい保てるのに、達成感が低めで、「自分はできる」という感覚が落ちやすい状態です。成果で評価される場面ほど失敗が怖くなり、準備に時間をかけるわりに実行が遅れて、結果が出ないことで自信が下がります。影響として、期限が近づくと焦りが増え、睡眠や生活リズムが乱れてさらに効率が落ちることがあります。身近な人に「最近つらそう」と言われたことや体調の変化をきっかけに、専門的に相談しようと考えて来談しました。強みとして、合理的に考えられることと、ルール化・仕組み化が得意ことが挙げられます。努力の価値は信じている一方で、成果が見えないと一気に気持ちが折れやすいです。自分を「努力はするが結果が出ない人」と見なしやすく、やる前から負けを想像してしまうことがあります。話し方は落ち着いており、事実と気持ちを行き来しながら説明します。緊張が高まっても表には出にくく、淡々と話してしまいがちです。良かった点や嬉しさは後回しになりやすく、評価が厳しくなりがちです。好みはあまり言葉にせず、周りに合わせてしまうことがあります。困ったときは、完璧主義を続けた結果として着手困難が起き、その後停滞が残って、また完璧主義で抱え込み直す、という循環になりやすいです。小さく試すより一気に片付けたい気持ちが強く、うまくいかないと「自分には無理」と全体を否定してしまいがちです。取り組む前はやる気があるのに、始められないと急に自信が落ち、「もう遅い」と投げやりになりがちです。今回の相談では、失敗コストを下げる着手ルール（実験として）を目標としており、日常で再現できる小さな手順に落とし込むことを望んでいます。現時点で命に関わる切迫した危険や自殺を考える状態は確認されていませんが、負担が続くと心身の消耗が増えやすいため早めの手当てが必要です。「やる」と決めた瞬間は前向きでも、少し遅れると一気に諦めモードに入ってしまいます。やりたい気持ちは本物なので、できない現実とのギャップが大きく、自己評価が揺れやすいです。

schema_version: "1.0"

scales:
  perma:
    description: "0=非常に低い, 10=非常に高い（事前の想定）"
    min: 0
    max: 10
  trait_expression:
    description: "-1=出にくい, 0=標準, +1=出やすい（発話としての出やすさ）"
    allowed_values: [-1, 0, 1]

definitions:
  perma:
    P: "Positive emotion（肯定感情）"
    E: "Engagement（没頭）"
    R: "Relationships（関係性）"
    M: "Meaning（意味）"
    A: "Accomplishment（達成）"
  interpersonal_styles:
    S1:
      label: "内省・協力型"
      brief: "感情や考えを言語化しようとし、質問に比較的素直に答える"
    S2:
      label: "防衛・懐疑型"
      brief: "早期は開示が少なく、提案や意味づけに懐疑的になりやすい"
    S3:
      label: "助言志向・せっかち型"
      brief: "結論や打ち手を早く求め、長い探索質問に焦れやすい"
  perma_focus_patterns:
    M1:
      label: "Meaning（意味）低下"
      primary_focus: "M"
    R1:
      label: "Relationships（関係）摩耗/孤立"
      primary_focus: "R"
    A1:
      label: "Accomplishment（達成）停滞/自己効力感低下"
      primary_focus: "A"
    P1:
      label: "Positive emotion不足/ストレス過多"
      primary_focus: "P"
    E1:
      label: "Engagement低下/注意散漫（スマホ等）"
      primary_focus: "E"

clients:
  C01:
    pattern: "M1"
    interpersonal_style: "S1"
    background:
      age_range: "30代前半"
      occupation_context: "会社員"
      living_situation: "同居"
      notes: null
    presenting_concern: "仕事が回っても「何のため感」が強い"
    baseline_perma: { P: 3, E: 4, R: 6, M: 2, A: 6 }
    strengths_resources:
      - "誠実で、話を整理しようとする"
      - "関係資源は一定ある"
    maintaining_cycle: "忙しい→考える余白なし→虚しさ→惰性"
    session_goal: "価値（大事にしたいこと）を言語化して一歩決めたい"
    safety:
      acute_crisis: false
      suicidal_ideation: false
    trait_expression:
      trait_expression_pos: 0.0
      trait_expression_neg: 1.0
      trait_expression_importance: 1.0
      trait_expression_confidence: 0.0
      trait_expression_like: 1.0
      trait_expression_tension: 0.0

